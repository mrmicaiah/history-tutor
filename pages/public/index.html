<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>history-tutor</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        background: #fafaf7;
        color: #1c1c1c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14140f;
          color: #ececec;
        }
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-weight: 500;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        margin: 0 0 0.5rem;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        opacity: 0.7;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>history-tutor</h1>
      <p>Under construction.</p>
    </main>
  </body>
</html>
