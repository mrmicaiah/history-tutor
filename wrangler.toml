name = "history-tutor"
main = "worker/src/index.ts"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

# D1 database binding.
#
# Before this Worker can deploy or run locally, you must:
#   1. Create the database:    wrangler d1 create history_tutor_db
#   2. Copy the printed `database_id` value into the field below.
#   3. Apply migrations remote: npm run db:migrate:remote
#      (or local for `wrangler dev`: npm run db:migrate:local)
#
# Until step 2 is done, `wrangler deploy` will fail. That is expected.
[[d1_databases]]
binding = "DB"
database_name = "history_tutor_db"
database_id = "7b50aeca-99e3-4203-888f-12e9804b2490"
migrations_dir = "worker/migrations"

# Frontend deployment configuration.
#
# `ALLOWED_ORIGIN` is the Pages origin used for direct browser access to
# the Worker (rare — most production traffic flows through the Pages
# Function proxy at `pages/functions/api/[[path]].ts`, which is server-
# to-server and not subject to CORS). `http://localhost:8788` is always
# kept in the allowlist as a fallback for local debugging.
#
# `COOKIE_DOMAIN` is unused with the Pages Function proxy: the proxy
# returns the Worker's `Set-Cookie` to the browser as if it came from
# the Pages origin, so a host-only cookie is correct. Uncomment only
# when deploying with a custom domain pair (e.g. `tutor.example.com` +
# `api.tutor.example.com`) and set it to the shared parent.

[vars]
ALLOWED_ORIGIN = "https://history-tutor.pages.dev"
# COOKIE_DOMAIN = ".your-domain.com"
